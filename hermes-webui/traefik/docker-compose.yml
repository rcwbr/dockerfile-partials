name: traefik-webui-proxy

services:
  traefik:
    image: traefik:v3.7.13
    container_name: traefik-proxy
    ports:
      - "8780:8780"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/devcontainers/hermes-webui/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/devcontainers/hermes-webui/traefik/dynamic:/etc/traefik/dynamic:ro
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    restart: unless-stopped
