name: traefik-webui-proxy

services:
  traefik:
    build:
      context: /opt/devcontainers/hermes-webui/traefik
      dockerfile: Dockerfile
    image: traefik-webui-proxy:latest
    container_name: traefik-webui-proxy
    ports:
      - "8780:8780"
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8780"
      - "--log.level=INFO"

  # Landing page served when the Hermes WebUI is not yet ready (502/503/504)
  landing:
    build:
      context: /opt/devcontainers/hermes-webui/traefik
      dockerfile: landing.Dockerfile
    image: traefik-webui-landing:latest
    container_name: traefik-webui-landing
    ports:
      - "8081:8081"
    command: ["caddy", "file-server", "--listen", ":8081", "--root", "/usr/share/caddy"]
    restart: unless-stopped

networks:
  default:
    name: traefik-webui-proxy
    driver: bridge
