<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes WebUI - Starting Up</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(71, 107, 255, 0.3);
      max-width: 500px;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #4768ff 0%, #00c8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .status {
      font-size: 1.2rem;
      color: #94a3b8;
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(71, 107, 255, 0.3);
      border-top-color: #4768ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .subtitle { font-size: 0.9rem; color: #64748b; margin-top: 1rem; }
    .footer { margin-top: 2rem; font-size: 0.8rem; color: #475569; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Hermes</div>
    <div class="status">
      <span class="spinner"></span>
      WebUI starting up...
    </div>
    <div class="subtitle">The Hermes Web UI is launching. This page will refresh automatically once it's ready.</div>
    <div class="footer">Traefik Reverse Proxy (port 8780)</div>
  </div>
  <script>
    setTimeout(function() { window.location.reload(); }, 10000);
  </script>
</body>
</html>
