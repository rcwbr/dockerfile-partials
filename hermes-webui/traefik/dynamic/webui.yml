http:
  routers:
    hermes-webui:
      rule: "PathPrefix(`/`)"
      service: hermes-webui-svc
      entryPoints:
        - "web"
      middlewares:
        - "webui-errors"
  middlewares:
    webui-errors:
      errors:
        status: "502-504"
        service: landing
        query: "/"
  services:
    hermes-webui-svc:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8787"
        healthCheck:
          path: "/health"
          interval: "5s"
          method: "GET"
    landing:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8081"
